mainSections   = ["post"]
rssFullContent = true
favicon        = "img/avatar.png"

[footer]
    since = 2026

[sidebar]
    emoji    = "✏️"
    subtitle = "记录学习与生活"
    avatar   = "img/avatar.png"

[article]
    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

# 没配评论后端，先关掉；以后接 giscus / waline 再打开
[comments]
    enabled = false

[cookies]
    enabled = false
